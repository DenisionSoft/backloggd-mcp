								<p class="mb-0 subtitle-text"><time datetime="2026-06-19T01:18:45Z" class="local-time-tooltip" data-local="time" data-format="%b %d, %Y">Jun 19, 2026</time></p>

				<div class="row mt-2 mb-3 review-body " review_id="4810026">
					<div class="col">
						<div class="position-relative">
							<div class="collapse mb-0 card-text" id="collapseReview4810026game">
								GENUINELY a flawed gem of a game. Elden Ring could have easily been my favorite game that FromSoftware has ever created, as it has a LOT of stupendous things going for it. It features some of—if not THE—greatest bosses in the Soulsborne franchise. From Dragonlord Placidusax, the game's own personal King Ghidorah, to the infamous Malenia, Blade of Miquella, the boss fights in this game are theatrical, electrifying, high-octane, and require for one to be locked the fuck in at all times.<br><br>Maliketh is one of my personal favorites in the game. Beating him with no summons or assistance from online was one of the most joyous moments of fulfillment I have ever gotten from a game, shouting out loud how proud I was that I finally beat him after getting absolutely decimated time and time again by his vitality-stealing moveset. My hands were trembling and sweaty even after the fight was long over; it's not often that I get experiences like that from a game. It's special. It's what I want from a game most importantly, which is to be challenged and to be tested—and if you are looking for that, Elden Ring will definitely test you.<br><br>Besides the boss battles, the combat here is phenomenal. Every attack genuinely feels satisfying to pull off against foes and bosses alike, and the game has some of the coolest weapons in a FromSoft game. However, I still think Bloodborne’s trick weapons beat Elden Ring in that department until the end of time if we are talking solely about weaponry. The OST in Elden Ring is memorable and legendary as well, but that's not shocking because every FromSoft game sounds ethereal OST-wise—I mean, Armored Core 4 For Answer has one of the most atmospheric and heavenly sounding title screen OSTs I've ever heard. The art direction in Elden Ring is luscious, vibrant, and downright beautiful, with each biome from Caelid to Limgrave having its own unique aura to them. I love the Legacy Dungeons here, as Miquella's Haligtree and Leyndell, Royal Capital are something to truly behold.<br><br>So, with all this great praise I am giving to Elden Ring, you would think I would give it a 5/5 stars no questions asked, right? Well, I hate to break it to you, but it gets 3 stars from me permanently for one glaring flaw it will forever have—a flaw that I have gone to war with so many people on and will continue to do so. Its open world is bloated, empty, barren, immensely uninspired, and generic. It's beautiful, but that's where the compliments end with it; it's just beautiful.<br><br>Let me start off first and foremost by saying I am not an open-world lover. Some of my favorite games of all time have amazing open worlds—Skyrim, Fallout 3, and New Vegas being some of them. However, 90% of the time, if a game has an open world, chances are I am not going to like it. Why? Because like with Elden Ring, the open world serves really no purpose but to artificially prolong game length. Elden Ring would have been a 5-star game from me easily if it was like its older siblings—Demon's Souls, Bloodborne, Dark Souls 1-3, etc.—which stuck with linearity for their level design. It was genius: finding shortcuts that led from one Legacy Dungeon to another in a clever way, with almost every single Legacy Dungeon feeling meaningful to explore through.<br><br>The open world of Elden Ring really does not have much to offer the player to see nor do; there really is no incentive to explore it at all, honestly. Instead of the Legacy Dungeons being connected to one another by cool shortcuts, feeling focused and streamlined due to linear level design, they are now separated by fat, pointless, giant barren wastes of grass like in Limgrave, or flooded plains like in Liurnia. Why even bother having enemies in these areas when the player can easily just ride past them on Torrent, who also feels horrible to navigate with, feeling clumsy and stiff. Once I discovered Sites of Grace, I never used that horse ever again.<br><br>The Catacombs you discover feel like literal copies of one another with subtle differences—maybe this one has different traps than the next—and almost every single one ends with you fighting a reused boss for the 500th time. Let's insert a Crucible Knight or a Leonine Misbegotten and call it a day. With barely any NPCs around to give you side quests or provide incentive to explore—with Ranni's quest truly feeling like the only fleshed-out side quest in the entire game—the open world just downright sucks.<br><br>I laugh when this game came out in 2022 and so many were echoing the same sentiments: that this game changed open-world games forever, or that it revolutionized the open-world formula. Pardon my French, but what the fuck has Elden Ring done that other open-world games haven't already done, if not better? It has done nothing. I don't know about everyone else, but I just wanted to go from one Legacy Dungeon to the next because it was an absolute drag riding from one section of the Lands Between to the next. It was genuinely egregious to endure through. The Legacy Dungeons are the real MEAT of the game; everything else was just unnecessary fat, in my opinion.<br><br>Due to the game having an open-world format, I never bothered going back to it. I beat it on PS5 and PC, along with the Shadow of the Erdtree DLC, and never looked back. I refuse to discover all the Sites of Grace again and ride Torrent through just a bunch of nothingness. I'd rather play Devil May Cry 2 than explore that sad case of an open world again, and that speaks volumes.<br><br>The irony here is that Fallout 3 has a better open world by tenfold, and the game's setting is when there isn't supposed to be anything around because everything was destroyed by nuclear fallout and radiation. The difference, though, is that there is always something interesting going on when you explore it. Explore far enough, and out of nowhere a little boy will approach you wanting you to help find his parents in the side quest called "Those!", after witnessing giant mutated fire ants decimate his town. A UFO crash occurs in the middle of the wasteland for you to explore the wreckage, leading to you being abducted into an alien mothership in the Mothership Zeta DLC. You will come across the Deathclaw Sanctuary, which is riddled with some of the most vile creatures you will face in the game, deep within having a Gatling laser called Vengeance if you kill them all. And due to NOT having a steed, you are incentivized to FIGHT any threat that comes your way, from a Super Mutant Master to an Enclave squadron. You can't just zoom right past them.<br><br>Fallout 3’s Capital Wasteland, Skyrim, and Fallout: New Vegas are the games to study if you want to create a compelling open world, in my opinion, because almost every single section of those games' worlds has something odd or peculiar going on to incentivize exploration. Not every game developer should create open-world games; FromSoftware is definitely one of them. It's simply just not their strength, which is totally fine because, as I stated earlier in this review, I am not a huge fan of open-world games to begin with. I prefer linear, Legacy Dungeon-to-Legacy Dungeon level design any day over an open world.<br><br>So, while I love Elden Ring for a myriad of different reasons, its open world and the way it was executed prevents me from ever wanting to touch it again. I have returned to nearly every single FromSoft game periodically time and time again, from Dark Souls 1, Dark Souls 2, and especially Bloodborne. Why? Because they don't force me to discover checkpoints in an open world that is too big and uninspired for its own good. I have no desire to discover those Sites of Grace again, nor ride on Torrent to get to the next Legacy Dungeon. It's a shame because it has so many pros, but all of that goes away after one playthrough or two.<br><br>I expect many to hate this take and disagree to the fullest, but I have over 1,000 hours on the game when you add up my PS5 playthrough, my PC playthrough, and then the Erdtree DLC. That's what it comes out to. No amount of time with the game will change my mind on its open world; it's just not good at all. Bloodborne, with all its flaws, is still the better game to me, along with Dark Souls 1. Hope you all enjoyed this review! &lt;3

							<div class="collapse mb-0 card-text" id="collapseReview4852274game">
								Yearly Fromsoftware replay - Elden Ring (6/6)<br><br>I don't know man... something about elden ring just doesn't click with me. There's just that connection that I have with almost every fromsoft game that is outright missing here. Why?<br><br>This may sound weird, but I think the reason for that is, from what I saw, the fact that <em>the game doesn't want you to play it</em>. what do I mean by that? Let me explain.<br>When you look back at elden ring and think of all the awesome moments, the most that will appear in your head is probably cool looking sights that you came across, and the bosses. But wait, we're missing something. And something big. The areas. Why are they missing? I remember running through caelid so mysteriously, why do I not cherish that moment nearly as much as fighting godfrey? You see I hid the answer in the question. You're "running through" the areas.<br><br>I feel like elden ring heavily encourages players to not really engage with the actual areas and levels and just continue to mindlessly run past them on and on and on all the way to the <em>next boss</em>. Because this is what this game is, an elongated boss rush. To put it as straightforward as possible, in all my 8-9 playthroughs of elden ring, I never looked forward to the areas. Not because they're bad but because there is nothing to look forward to in them. The game pushes you to avoid interacting with them and I tried very often to actually explore them in detail and fight every enemy but that never turned out well. I either found nothing and didn't get rewarded for my curiousity or I came across an unfair group of enemies which are clearly just there to serve the purpose of looking scary so that you avoid them to make sure that the game actually has enemies and isn't as empty as it looks. So for the most part this game consisted of me just running and running and running and running until I found the next boss. I fought the boss, beat the boss and then went on another uninteresting running expedition to the next boss. When there's practically nothing to the areas besides visuals, after a while of not having a lot to interact with the game begins to feel repetitive. And it doesn't help whatsoever that bosses are heavily recycled in the open world and when exploring you rarely expect to find something new besides progression. I think if you took all of the recycled content in the game away the world of elden ring would be extremely empty and lifeless, but if you keep them the game would be extremely repetitive and lifeless. No matter what fromsoft does, the formula of elden ring just manages to feel lifeless. Maybe the souls formula just doesn't work with open worlds, or maybe they seriously screwed up the design but either way elden ring is in my opinion a failed project. It is not a bad game by any means and I think it's even great, but for what it's trying to achieve, for me it is an unfortunate failure.<br><br>Now that I'm done flaming the game to oblivion, I think it's time to talk about what made me give this game an 8/10 even with all the critisism.<br><br>The bosses. THE BOSSES. Easily put, this game has the best boss roster of all time. Of course I mean all the mandatory and great rune bosses and not the recycled uninteresting side bosses that don't really matter. Almost each and every boss fight in this game is a standout in it's own way. The fights are super fluid, fast, responsive, demanding, challenging and basically everything else that makes a souls boss legendary. I think It's best if I just talk about the bosses individually and rank them all like in my review of the old hunters dlc.<br><br>ᴍᴀʀɢɪᴛ, ᴛʜᴇ ꜰᴇʟʟ ᴏᴍᴇɴ (10/10)<br><br>This is how you create an introductory boss in a fromsoft game. With games notorious for being challenging, unfair and unforgiving, it's obvious that a boss like margit who just so happens to be all of these, is gonna be a perfect introduction into the game. Just a wonderful boss all around that really makes you understand what game you're playing the moment you fight him all the way to the moment you finally beat him.<br><br>ɢᴏᴅʀɪᴄᴋ ᴛʜᴇ ɢʀᴀꜰᴛᴇᴅ (9/10)<br><br>An amazing follow up to Margit. his cutscenes are wonderful and the fight is super awesome. Not much to say about him besides the fact that he's an amazing boss.<br><br>ʀᴇᴅ ᴡᴏʟꜰ ᴏꜰ ʀᴀᴅᴀɢᴏɴ (6/10)<br><br>Usually I give a 6 to mandatory bosses that don't stand out very much but still serve their unimportant purpose nicely. This boss is no exception to that.<br><br>​🇷​​🇪​​🇳​​🇳​​🇦​​🇱​​🇦​, ​🇶​​🇺​​🇪​​🇪​​🇳​ ​🇴​​🇫​ ​🇹​​🇭​​🇪​ ​🇫​​🇺​​🇱​​🇱​ ​🇲​​🇴​​🇴​​🇳​ (7/10)<br><br>While the first phase is a straight up gank which involves very little interaction in an actual fight and the second half is pretty janky and annoying, I still think this boss is pretty nice and serves it's purpose very nicely.<br><br>​🇸​​🇹​​🇦​​🇷​​🇸​​🇨​​🇴​​🇺​​🇷​​🇬​​🇪​ ​🇷​​🇦​​🇩​​🇦​​🇭​​🇳​ (8/10)<br><br>Best described as an epic fight. It's unique due to it being a festival full of all kinds of fighters and it's super enjoyable. No hitting him alone was one of the most challenging things I've done in my history with fromsoftware and I don't regret one second of it.<br><br>ᴅʀᴀᴄᴏɴɪᴄ ᴛʀᴇᴇ ꜱᴇɴᴛɪɴᴇʟ (7/10)<br><br>Fuck you.<br><br>ɢᴏʟᴅꜰʀᴇʏ, ꜰɪʀꜱᴛ ᴇʟᴅᴇɴ ʟᴏʀᴅ (8.5/10)<br><br>He feels kind of pointless but he's also godfrey so hes a pretty great boss either way. Just extremely underwhelming.<br><br>ᴍᴏʀɢᴏᴛᴛ, ᴛʜᴇ ᴏᴍᴇɴ ᴋɪɴɢ (10/10)<br><br>Now we're talking. He's fast, responsive, demanding, challenging, super fast and unforgiving and pretty much everything that makes a fromsoft boss legendary for me. I could fight him for hours without getting bored once and he may just be my favorite mandatory boss (great rune not included). Too bad he's super exploitable if you know what you're doing.<br><br>ꜰɪʀᴇ ɢɪᴀɴᴛ (6.5/10)<br><br>meh. Not great not bad just annoying as shit. he's a nice gank fight but the constant fleeing and explosions make him really annoying at times.<br><br>ɢᴏᴅꜱᴋɪɴ ᴅᴜᴏ (7/10)<br><br>actually not that bad, just has some bullshit that I can't forgive like the fat guy's second phase transition. But overall a surprisingly not that bad of a boss.<br><br>ᴍᴀʟɪᴋᴇᴛʜ, ᴛʜᴇ ʙʟᴀᴄᴋ ʙʟᴀᴅᴇ (10/10)<br><br>First phase is super fast and demanding, second phase is some of the scariest shit I've ever seen in fromsoft. This dude's presence is on another dimension. He's so epic and enjoyable and the second phase just presents him perfectly.<br><br>ꜱɪʀ ɢɪᴅᴇᴏɴ ᴏꜰɴɪʀ, ᴛʜᴇ ᴀʟʟ-ᴋɴᴏᴡɪɴɢ (2/10)<br><br>no exceptions for this one. One of the worst boss fights I've ever fought. His entire moveset is just a bunch of bs and the way you beat him is even more bs. You just keep stunning him out of his attack and pray he doesn't randomly dodge and nuke you. Just a stupid boss and has nothing good to him.<br><br>​🇬​​🇴​​🇩​​🇫​​🇷​​🇪​​🇾​, ​🇫​​🇮​​🇷​​🇸​​🇹​ ​🇪​​🇱​​🇩​​🇪​​🇳​ ​🇱​​🇴​​🇷​​🇩​ (10/10)<br><br>On par with Morgott for being the best mandatory boss in the game. Both of them are some of the best bosses of all time and Godfrey is just wonderful. One of the most fluid boss fights in fromsoft history, some of the best cinematics, presence and overall just a masterful boss fight. They nailed it with this one.<br><br>​🇪​​🇱​​🇩​​🇪​​🇳​ ​🇧​​🇪​​🇦​​🇸​​🇹​ (8/10)<br><br>I still think to this day that if the final boss was radagon with 2 health bars it would be one of the best bosses of all time but elden beast as a second phase is just underwhelming and disappointing especially as the final boss fight of the game. Still not bad by any means but just not acceptable for me as the final encounter of the game. Radagon is easily a masterpiece of a boss fight tho.<br><br>​🇷​​🇾​​🇰​​🇦​​🇷​​🇩​, ​🇱​​🇴​​🇷​​🇩​ ​🇴​​🇫​ ​🇧​​🇱​​🇦​​🇸​​🇵​​🇭​​🇪​​🇲​​🇾​ (8/10)<br><br>Cool gank boss, not much to say about him but I liked him.<br><br>​🇲​​🇴​​🇭​​🇬​, ​🇱​​🇴​​🇷​​🇩​ ​🇴​​🇫​ ​🇧​​🇱​​🇴​​🇴​​🇩​ (8/10)<br><br>He's an amazing boss but mannnn he has so much bullshit that just brings the entire fight down for me. I still like him but not as much as I would if he wasn't so full of shit.<br><br>​🇲​​🇦​​🇱​​🇪​​🇳​​🇮​​🇦​, ​🇧​​🇱​​🇦​​🇩​​🇪​ ​🇴​​🇫​ ​🇲​​🇮​​🇶​​🇺​​🇪​​🇱​​🇱​​🇦​ (10/10)<br><br>Straight to the point. This is my favorite boss fight of all time. I remember doing a no hit challenge for every boss in elden ring and I was stuck on malenia for about 200 attempts and let me tell you that I enjoyed every second of it. Every death felt legit and like it was my fault and I could always tell what I could do better, every improvement felt genuine and like actually progress towards beating the boss and not just me begging that I get lucky one attempt, and so one. Not one second was spent in sadness with that.I still think to this day that she's probably the most perfect combination of fluid, punishing, unpredictable, demanding and challenging. With Malenia you ALWAYS have to watch your position because you never know what she's gonna pull out on you and yet you still need to keep a respectably close distance so that you can smoothly dodge her attacks without being caught in one that punishes long distances. It's perfect. Each move you make has to be calculated and thought out. You can never stay too close or too far and that's what it means to be a demanding boss. Her move set is absolutely perfect in every way and makes you watch out for every possible mistake in positioning or decision making that you could make. Truly and unforgettable boss fight that I don't think will be surpassed any time soon.<br><br>From what you can tell, I think very highly of the bosses in elden ring, and it is the sole reason that I give this game the respect it deserves. I still think the areas are pretty much lifeless and very forgettable with them only being an excused passageway to the next boss unlike being their own special part of the game like in previous games in the series but It doesn't mean that I think the gamae is bad by any means. Just a failed attempt at making an open world souls game that makes sense which I think ultimately isn't very possible with modern technology and Miyazaki set his expectations a bit too high for this game. I still have respect for elden ring and the influence that it will have on future releases and it is overall a great, 8/10 experience.

							<div class="collapse mb-0 card-text" id="collapseReview5019868game">
								<strong>Elden Ring - Deixem Dark Souls Morrer</strong><br><br>Escolhendo enxergar Elden Ring como um experimento, é difícil negar que ele representa um passo importante na trajetória da FromSoftware. Depois de três Dark Souls, Bloodborne e Sekiro, insistir na mesma estrutura talvez fosse mais confortável, mas certamente menos interessante. Arriscar a fórmula em direção a um mundo aberto parecia um movimento natural para um estúdio que sempre fez da exploração espacial um de seus maiores trunfos. O problema é que, ao expandir sua escala, a FromSoftware levou consigo uma filosofia de design concebida para espaços muito menores. Em vez de reinventá-la, tentou esticá-la. É justamente dessa incompatibilidade que nasce quase toda a minha frustração com Elden Ring.<br><br>Nos títulos anteriores, a sensação de descoberta não dependia da quantidade de conteúdo, mas da relação entre seus elementos. Um atalho reorganizava completamente a percepção do mapa; uma chave fazia lembrar imediatamente de uma porta encontrada horas antes; uma torre vista à distância acabava revelando um caminho inesperado até uma região já conhecida. O mundo era relativamente pequeno, mas extremamente denso. Cada elemento parecia existir porque dialogava com outro.<br><br>Em Elden Ring, essa lógica se enfraquece. O mapa cresce em proporções inéditas, mas sua densidade permanece praticamente a mesma. O resultado é um mundo belíssimo, porém diluído. Entre um grande momento e outro existem quilômetros de terreno cuja principal função parece ser apenas separar pontos de interesse. A escala impressiona durante as primeiras horas, mas, conforme a campanha avança, torna-se difícil não perceber que boa parte dela serve mais para prolongar o tempo de jogo do que para enriquecer a experiência.<br><br>Essa mudança de escala produz uma consequência inevitável: preencher um mundo tão grande exige uma quantidade de conteúdo que nem mesmo a FromSoftware consegue sustentar. A repetição passa a deixar de ser exceção para se tornar regra. Catacumbas, minas, cavernas e túneis compartilham layouts, objetivos e soluções visuais quase intercambiáveis. Poucas dungeons possuem identidade suficiente para permanecer na memória depois de concluídas. E o mesmo acontece com o bestiário. Dragões surgem em excesso, chefes retornam inúmeras vezes como inimigos comuns ou aparecem novamente em encontros duplos apenas para aumentar artificialmente o número de desafios. O reaproveitamento sempre existiu nos jogos da FromSoftware, mas aqui ele deixa de parecer uma economia pontual de recursos e passa a transmitir a sensação de que o jogo esgota seu repertório muito antes do fim.<br><br>Quando a exploração perde variedade, ela inevitavelmente perde significado. Encontrar uma nova caverna ou desviar do caminho principal deveria despertar curiosidade. Em vez disso, aos poucos surge a expectativa de encontrar exatamente aquilo que já foi visto dezenas de vezes. O problema se agrava porque as recompensas raramente justificam o esforço. Magias destinadas a builds específicas, talismãs extremamente situacionais e novos Spell Slots aparecem com muito mais frequência do que equipamentos capazes de interessar qualquer jogador.<br><br>Minha experiência como mago amenizou parte dessa frustração, mas justamente por isso evidenciou outro problema. Enquanto boa parte das descobertas dialogava diretamente com minha build, alguém focado em força ou destreza provavelmente encontraria muito menos valor explorando os mesmos lugares. Um mundo aberto deveria incentivar a exploração independentemente da forma como o jogador escolheu construir seu personagem. Em Elden Ring, esse incentivo varia demais conforme a build adotada.<br><br>Essa assimetria aparece novamente quando o assunto é liberdade de construção. Existe uma enorme quantidade de armas, feitiços e habilidades, mas quantidade não significa necessariamente diversidade. Muitas armas compartilham movimentos semelhantes, diferentes builds acabam convergindo para estratégias parecidas e o próprio balanceamento favorece um conjunto relativamente pequeno de opções realmente eficientes. A sensação de liberdade existe, mas ela é menor do que o enorme volume de conteúdo faz parecer. E o balanceamento também sofre como consequência da própria estrutura do mundo aberto. <br><br>Como cada jogador chega aos desafios em momentos diferentes da progressão, muitos encontros acabam sendo completamente trivializados, enquanto outros parecem desproporcionalmente difíceis. A dificuldade deixa de depender principalmente do domínio das mecânicas e passa a depender, em grande medida, da ordem em que o mapa foi explorado. O que pode ser percebido até mesmo nos chefes principais. Muitos deles parecem concebidos para enfrentar tudo aquilo que o jogador pode acumular ao longo da campanha: invocações, Ashes of War, Spirit Ashes e builds extremamente poderosas. O resultado são confrontos marcados por sequências longas de ataques, rastreamento agressivo, delays constantes e janelas de punição cada vez menores. A dança cuidadosa entre ataque e defesa, que caracterizava tantos chefes memoráveis da série Souls, frequentemente dá lugar a um espetáculo de agressividade contínua que parece tentar compensar mecanicamente a enorme liberdade concedida ao jogador.<br><br>O pangaré Torrent talvez seja o exemplo mais claro dessa mudança de filosofia. Apesar de acompanhar praticamente toda a campanha, ele permanece surpreendentemente superficial. Não possui progressão significativa, sistemas próprios ou qualquer personalização relevante. Sua principal função é reduzir o tempo gasto atravessando um mundo grande demais para ser percorrido a pé. O próprio jogo parece reconhecer que seu mapa é extenso a ponto de exigir ferramentas para acelerar o deslocamento. O salto de Torrent, a enorme quantidade de Sites of Grace e a facilidade do teleporte existem muito mais para resolver um problema criado pela própria escala do que para enriquecer suas possibilidades mecânicas. Em consequência disso, grande parte dos inimigos espalhados pelo mapa simplesmente deixa de importar. É quase sempre mais eficiente ignorá-los completamente e seguir cavalgando até o próximo objetivo. Enquanto isso, os Legacy Dungeons concentram praticamente sozinhos o melhor level design do jogo, justamente porque recuperam a filosofia espacial que sempre definiu a identidade da FromSoftware.<br><br>Até mesmo a direção de arte acaba evidenciando essa tensão. Poucos jogos produziram paisagens tão memoráveis quanto Elden Ring. Cada horizonte parece digno de um quadro. No entanto, muitas dessas paisagens funcionam melhor como contemplação do que como espaço de interação. É um mundo extraordinariamente bonito, mas cuja beleza frequentemente supera aquilo que ele efetivamente oferece para ser descoberto.<br><br>Nada disso significa que a FromSoftware deveria abandonar a ideia de um mundo aberto. Pelo contrário. A tentativa era necessária, e talvez fosse inevitável para um estúdio que já havia explorado quase todos os limites da estrutura tradicional de Dark Souls. O problema é que Elden Ring ainda parece dividido entre duas filosofias incompatíveis. De um lado, tenta preservar a densidade espacial, o level design interconectado e a descoberta cuidadosamente construída que transformaram a série Souls em uma referência. Do outro, adota a escala, a liberdade e a dispersão próprias dos grandes mundos abertos. Até agora, essas duas ideias coexistem mais do que se complementam.<br><br>Talvez Elden Ring não seja a síntese definitiva da fórmula Souls, mas justamente o jogo que demonstra seus limites. Se a FromSoftware pretende continuar seguindo esse caminho, o próximo passo não deveria ser fazer um mundo ainda maior. Deveria ser, enfim, aceitar que Dark Souls cumpriu seu papel. A evolução não consiste em expandir uma fórmula até que ela se rompa, mas em encontrar uma linguagem nova, construída para sustentar as ambições que esse novo tipo de mundo exige. Acredito que a verdadeira evolução não acontecerá enquanto tentarem fazer Dark Souls habitar um mundo aberto, mas quando a FromSoftware finalmente aceitar que esses mundos merecem uma linguagem própria.
