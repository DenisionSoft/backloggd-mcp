name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Parsers run against saved fixtures, so the suite needs no network and no
      # Backloggd account. `--selftest` is the one that hits the live site, and it is
      # deliberately not run in CI.
      - run: npm test
